<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TON Treasury Viewer + BOC Decoder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f5f5f5;
      color: #333;
    }

    h1, h3 {
      color: #2c3e50;
    }

    input[type="text"], textarea {
      padding: 8px;
      margin: 5px 0;
      width: 100%;
      max-width: 600px;
      font-size: 1em;
    }

    button {
      padding: 10px 15px;
      margin: 5px 5px 15px 0;
      font-size: 1em;
      cursor: pointer;
    }

    #tonTreasuryTool .result-block {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 15px 0;
      background-color: #fff;
      border-radius: 5px;
    }

    #tonTreasuryTool .result-header {
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 5px;
    }

    #tonTreasuryTool .result-content {
      display: none;
      margin-top: 10px;
      white-space: pre-wrap;
      font-family: monospace;
    }

    #tonTreasuryTool .result-block.open .result-content {
      display: block;
    }

    #statusBalance {
      margin: 10px 0;
      font-weight: bold;
    }

    #statusBalance.error {
      color: red;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    table th, table td {
      padding: 8px;
      border: 1px solid #ccc;
      text-align: left;
    }

    textarea {
      font-family: monospace;
    }
  </style>
  <script type="module" crossorigin src="/bocdecoder/assets/start-CuFVyQk4.js"></script>
  <link rel="modulepreload" crossorigin href="/bocdecoder/assets/modulepreload-polyfill-B5Qt9EMX.js">
</head>
<body>
  <section id="tonTreasuryTool">

    <!-- HEADER SECTION -->
    <div style="background: #fff; padding: 15px; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">

      <!-- Main Treasury Section -->
      <div style="flex: 1; min-width: 300px;">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
          <label for="treasurySelect" style="white-space: nowrap; font-weight: bold;">Selected Treasury:</label>
          <select id="treasurySelect" style="flex: 1; padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; background-color: #fff; font-size: 14px;">
            <!-- Options populated dynamically -->
          </select>
        </div>
      
        <div style="margin-top: 10px;">
          <button id="viewAddressBtn">View in TonViewer</button>
          <button id="checkStatusBtn">Check Contract Status & Balance</button>
          <button id="autoDecodeBtn">Auto Decode Treasury State</button>
        </div>
      
        <div id="statusBalance" style="margin-top: 10px;"></div>
      </div>

      <!-- Wallet Input -->
      <div style="min-width: 280px; flex: 1;">
        <label for="walletAddressInput" style="display: block; margin-bottom: 5px;">
          <strong>Wallet Address:</strong>
        </label>
        <div style="display: flex; align-items: center; gap: 10px;">
          <input
            type="text"
            id="walletAddressInput"
            placeholder="Enter wallet address"
            style="flex: 1;"
          />
          <button id="processWalletBtn">Process</button>
        </div>
        <div id="walletResult" style="margin-top: 10px;"></div>
      </div>
      

    </div>

    <!-- PIE CHART SECTION -->
    <div style="display: flex; justify-content: flex-start; margin-bottom: 20px;">
      <div style="background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <canvas id="investorPieChart" width="300" height="300"></canvas>
      </div>
    </div>

    <!-- RESULTS SECTION -->
    <div id="resultsContainer"></div>

  </section>

  <!-- Scripts -->
  <script>
    document.getElementById('goBackBtn')?.addEventListener('click', () => {
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
